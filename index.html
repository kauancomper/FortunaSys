<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FortunaSys — Gestão Inteligente para Bingos</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Space+Grotesk:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #D4AF37;
            --primary-glow: rgba(212, 175, 55, 0.3);
            --secondary: #A88732;
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --success: #10B981;
            --danger: #F43F5E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(212, 175, 55, 0.05), transparent 80%),
                radial-gradient(circle at 0% 0%, rgba(0, 0, 0, 1), transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .bebas {
            font-family: 'Bebas Neue', cursive;
            letter-spacing: 1px;
        }

        .space {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        }

        .main-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-bottom: 50px;
            padding: 20px;
        }

        .main-header img {
            width: 80px;
            height: auto;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        .main-header .title-group {
            text-align: left;
        }

        .main-header h1 {
            font-size: 4rem;
            color: var(--primary);
            letter-spacing: 4px;
            line-height: 0.9;
            margin: 0;
        }

        @media (max-width: 768px) {
            .main-header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                margin-bottom: 30px;
            }

            .main-header .title-group {
                text-align: center;
            }

            .main-header h1 {
                font-size: 2.2rem;
                letter-spacing: 2px;
            }

            .main-header img {
                width: 60px;
            }
        }

        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 30px;
            border-radius: 24px;

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);

        }

        .stat-box {
            padding: 25px;
            border-radius: 24px;

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, transparent 100%);

        }

        .stat-box:hover {
            border-color: var(--primary);

        .sales-table {

            display: flex;

        .table-header {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 120px;
            gap: 15px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 18px 18px 0 0;

            text-transform: uppercase;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .table-body {
            flex: 1;

        }

        .sale-row {
            display: grid;
            grid-template-columns: 80px 1fr 1fr 1fr 120px;
            gap: 15px;

        .btn-action {

        .btn-primary:hover {

        .btn-outline {

            gap: 15px;
            margin-bottom: 30px;

            color: var(--text-dim);

            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .nav-link.active {
            background: var(--primary);
            color: #000;
            border: 1px solid var(--primary);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        .bingo-main-area {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .bingo-header-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .h-stat {
            padding: 25px;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);

        .h-stat:hover {

        .h-stat-val {

            font-size: 2.2rem;

            color: var(--primary);

        .number-board {

            grid-template-columns: repeat(15, 1fr);

        .num-btn {

            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;

            align-items: center;
            justify-content: center;
            font-weight: 900;

            color: rgba(255, 255, 255, 0.1);

        .num-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.4);
        }

        .num-btn.active {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #000;
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.08);
            z-index: 2;
            border-color: #fff;
        }

        .bingo-footer-stats {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 12px;
        }

        .f-stat {
            padding: 18px 5px;
            text-align: center;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);

        .f-stat.active-glow {

            background: rgba(244, 63, 94, 0.08);

        .f-stat-val {
            display: block;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-main);
            font-family: 'Bebas Neue';
        }

        .f-stat.active-glow .f-stat-val {
            color: var(--danger);
        }

        .f-stat-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            color: var(--text-dim);
            font-weight: 700;
            letter-spacing: 0.5px;

        .winners-box {
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;

        .winner-mini {
            background: rgba(255, 255, 255, 0.02);

        .winner-mini:hover {

        .winner-mini h5 {
            font-size: 0.85rem;
            color: var(--success);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .winner-mini p {
            font-size: 0.65rem;
            color: var(--text-dim);

        .big-call {
            padding: 40px;
            text-align: center;
            background: radial-gradient(circle at center, rgba(251, 191, 36, 0.08) 0%, transparent 80%);

        }

        .big-num-call {
            font-size: 7.5rem;
            color: var(--primary);
            line-height: 0.9;
            margin: 15px 0;
            font-family: 'Bebas Neue';

        /* CARTELA DIGITAL */
        .bingo-card-digital {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 20px;
            border: 2px solid var(--glass-border);

        }

        .bingo-card-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
        }

        .bingo-card-header span {
            text-align: center;
            padding: 10px;
            font-family: 'Bebas Neue';
            font-size: 1.5rem;
            color: var(--primary);
            letter-spacing: 2px;
        }

        .bingo-card-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            background: var(--glass-border);
        }

        .card-num {
            background: var(--bg);
            aspect-ratio: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;

            font-family: 'Bebas Neue';

        }

        .card-num.is-drawn {
            background: var(--primary);
            color: #000;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 1100px) {
            .bingo-grid {
                grid-template-columns: 1fr;
            }

            .number-board {
                grid-template-columns: repeat(10, 1fr);
            }

            .bingo-footer-stats {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
                padding: 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-box {
                padding: 15px;
            }

            .stat-value {
                font-size: 1.5rem;
            }

            .sale-form {
                padding: 25px 20px;
                margin: 10px auto;
            }

            .table-header,
            .sale-row {
                grid-template-columns: 60px 1fr 1fr;
                font-size: 0.7rem;
                padding: 12px 15px;
            }

            /* Esconder colunas menos importantes no celular para não amontoar */
            .table-header div:nth-child(3),
            .table-header div:nth-child(4),
            .sale-row div:nth-child(3),
            .sale-row div:nth-child(4) {
                display: none;

            .modal-content {

            }

            .modal-content .bebas {
                font-size: 3rem !important;
            }

            .number-board {
                grid-template-columns: repeat(5, 1fr) !important;
                gap: 5px !important;
                padding: 15px !important;
            }

            .num-btn {
                font-size: 0.8rem !important;
                border-radius: 8px !important;
            }

            .bingo-grid {

            .admin-nav {

        @media (max-width: 480px) {

        .success-toast {
            position: fixed;

            left: 50%;

            z-index: 2000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);

</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = 'https://ffxkzvmilzhwhfhwdtmh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmeGt6dm1pbHpod2hmaHdkdG1oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxOTI2NDgsImV4cCI6MjA5Mzc2ODY0OH0.luNIA3O7JeOb1JkTI6ell6RgIwpkzbQUVdEKJ_8Ucsw';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const TOTAL_CARDS = 800;

        function App() {
            const [salesData, setSalesData] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [view, setView] = useState('sales');
            const [adminTab, setAdminTab] = useState('vendas'); // 'vendas' ou 'bingo'
            const [search, setSearch] = useState('');
            const [showLogin, setShowLogin] = useState(false);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState(false);
            const [showToast, setShowToast] = useState(false);
            const [isRaffleModal, setIsRaffleModal] = useState(false);
            const [raffleResult, setRaffleResult] = useState(null);
            const [isRaffling, setIsRaffling] = useState(false);

            const [formCard, setFormCard] = useState('');
            const [formBuyer, setFormBuyer] = useState('');
            const [formPhone, setFormPhone] = useState('');
            const [formSeller, setFormSeller] = useState('');
            const [cardStatusMsg, setCardStatusMsg] = useState(null);

            // ESTADOS DO BINGO
            const [drawnNumbers, setDrawnNumbers] = useState(() => {
                const saved = localStorage.getItem('bingo_drawn_numbers');
                return saved ? JSON.parse(saved) : [];
            });
            const [lastDrawn, setLastDrawn] = useState(() => {
                const saved = localStorage.getItem('bingo_last_drawn');
                return saved ? parseInt(saved) : null;
            });
            const [verifyingBingo, setVerifyingBingo] = useState(null);

            // Persistência automática do sorteio
            useEffect(() => {
                localStorage.setItem('bingo_drawn_numbers', JSON.stringify(drawnNumbers));
                if (lastDrawn) localStorage.setItem('bingo_last_drawn', lastDrawn.toString());
                else localStorage.removeItem('bingo_last_drawn');
            }, [drawnNumbers, lastDrawn]);

            // CARTELAS FIXAS (800 unidades simplificadas para sorteio)
            // No mundo real, você usaria o banco de dados. Aqui vamos simular os números para conferência.
            // Para ser 100% real, precisaríamos dos números de cada cartela aqui.
            // Vamos assumir que você carregará o excel ou já tem os dados.
            const [bingoCards, setBingoCards] = useState([]);

            useEffect(() => {
                const loadCards = async () => {
                    const response = await fetch('cards_data.json');
                    if (response.ok) {
                        const data = await response.json();
                        setBingoCards(data);
                    }
                };
                loadCards();
            }, []);

            // Máscara de Telefone
            const formatPhone = (value) => {
                if (!value) return value;
                const phoneNumber = value.replace(/[^\d]/g, '');
                const phoneNumberLength = phoneNumber.length;
                if (phoneNumberLength < 3) return phoneNumber;
                if (phoneNumberLength < 7) {
                    return `(${phoneNumber.slice(0, 2)}) ${phoneNumber.slice(2)}`;
                }
                return `(${phoneNumber.slice(0, 2)}) ${phoneNumber.slice(2, 7)}-${phoneNumber.slice(7, 11)}`;
            };

            const handlePhoneChange = (e) => {
                const formattedValue = formatPhone(e.target.value);
                setFormPhone(formattedValue);
            };

            // Verificação em tempo real
            useEffect(() => {
                const id = parseInt(formCard);
                if (!id) {
                    setCardStatusMsg(null);
                    return;
                }
                const card = salesData.find(c => c.id === id);
                if (card && card.sold) {
                    setCardStatusMsg(`⚠️ ESTA CARTELA JÁ FOI VENDIDA PARA: ${card.buyer.toUpperCase()}`);
                } else if (id > TOTAL_CARDS || id < 1) {
                    setCardStatusMsg(`❌ NÚMERO INVÁLIDO (LIMITE: 1 A ${TOTAL_CARDS})`);
                } else {
                    setCardStatusMsg(null);
                }
            }, [formCard, salesData]);

            // BUSCAR DADOS DA NUVEM
            const fetchData = async () => {
                setIsLoading(true);
                const { data, error } = await supabase
                    .from('vendas_bingo')
                    .select('*');

                if (error) {
                    console.error('Erro ao buscar dados:', error);
                } else {
                    // Mapeia os dados da nuvem para o formato local
                    const cloudMap = new Map(data.map(item => [item.id, item]));
                    const fullList = Array.from({ length: TOTAL_CARDS }, (_, i) => {
                        const id = i + 1;
                        return cloudMap.get(id) || { id, buyer: '', phone: '', seller: '', sold: false };
                    });
                    setSalesData(fullList);
                }
                setIsLoading(false);
            };

            useEffect(() => {
                fetchData();
                // Opcional: Atualizar a cada 30 segundos ou usar Realtime
                const interval = setInterval(fetchData, 30000);
                return () => clearInterval(interval);
            }, []);

            const submitSale = async (e) => {
                e.preventDefault();
                const cardId = parseInt(formCard);

                if (cardId < 1 || cardId > TOTAL_CARDS) {
                    alert(`Número de cartela inválido! (Limite: 1 a ${TOTAL_CARDS})`);
                    return;
                }

                // RESTRIÇÃO 1: Bloquear cadastro se a cartela já estiver vendida
                const existingCard = salesData.find(c => c.id === cardId);
                if (existingCard && existingCard.sold) {
                    alert(`ERRO: A cartela ${cardId} já foi vendida para ${existingCard.buyer}!`);
                    return;
                }

                const newSale = {
                    id: cardId,
                    buyer: formBuyer,
                    phone: formPhone,
                    seller: formSeller,
                    sold: true
                };

                // SALVAR NO SUPABASE (UPSERT)
                const { error } = await supabase
                    .from('vendas_bingo')
                    .upsert(newSale);

                if (error) {
                    alert('Erro ao salvar na nuvem: ' + error.message);
                } else {
                    // Atualiza localmente para feedback instantâneo
                    setSalesData(prev => prev.map(c => c.id === cardId ? newSale : c));
                    setFormCard(''); setFormBuyer(''); setFormPhone(''); setFormSeller('');
                    setShowToast(true); setTimeout(() => setShowToast(false), 3000);
                }
            };

            const handleLogin = (e) => {
                if(e) e.preventDefault();
                if(loginUser === 'admin' && loginPass === 'admin123') {
                    setView('admin');
                    setShowLogin(false);
                    setLoginUser('');
                    setLoginPass('');
                    setLoginError(false);
                } else {
                    setLoginError(true);
                    setTimeout(() => setLoginError(false), 2000);
                }
            };

            const startRaffle = () => {
                const soldCards = salesData.filter(s => s.sold);
                if (soldCards.length === 0) return alert('Nenhuma cartela vendida para o sorteio!');
                setIsRaffleModal(true); setIsRaffling(true); setRaffleResult(null);

                let iter = 0;
                const interval = setInterval(() => {
                    setRaffleResult(soldCards[Math.floor(Math.random() * soldCards.length)]);
                    if (++iter >= 30) {
                        clearInterval(interval); setIsRaffling(false);
                        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                    }
                }, 100);
            };

            const stats = useMemo(() => {
                const sold = salesData.filter(s => s.sold).length;
                const total = TOTAL_CARDS;
                return { total, sold, open: total - sold, percent: total > 0 ? Math.round((sold / total) * 100) : 0 };
            }, [salesData]);

            // Mapa de busca rápida para as cartelas
            const cardsMap = useMemo(() => {
                const map = new Map();
                bingoCards.forEach(c => map.set(parseInt(c.num), c.numbers));
                return map;
            }, [bingoCards]);

            // LÓGICA DE SORTEIO OTIMIZADA
            const bingoStats = useMemo(() => {
                if (!cardsMap.size) return { f1: 0, f2: 0, f3: 0, f4: 0, f5: 0, f7: 0, f10: 0, winners: [] };

                const active = salesData.filter(s => s.sold);
                const dSet = new Set(drawnNumbers);
                const results = { f1: 0, f2: 0, f3: 0, f4: 0, f5: 0, f7: 0, f10: 0, winners: [] };

                active.forEach(sale => {
                    const cardNumbers = cardsMap.get(parseInt(sale.id));
                    if (cardNumbers) {
                        const miss = cardNumbers.filter(n => !dSet.has(n)).length;
                        if (miss === 0) results.winners.push({ ...sale, numbers: cardNumbers });
                        else if (miss === 1) results.f1++;
                        else if (miss === 2) results.f2++;
                        else if (miss === 3) results.f3++;
                        else if (miss === 4) results.f4++;
                        else if (miss === 5) results.f5++;
                        else if (miss === 7) results.f7++;
                        else if (miss === 10) results.f10++;
                    }
                });
                return results;
            }, [salesData, drawnNumbers, cardsMap]);

            const toggleNumber = (n) => {
                setDrawnNumbers(prev => {
                    if (prev.includes(n)) return prev.filter(x => x !== n);
                    setLastDrawn(n);
                    return [...prev, n];
                });
            };

            const resetBingo = () => {
                if (confirm('ATENÇÃO: Deseja limpar todas as pedras e começar um novo sorteio?')) {
                    setDrawnNumbers([]);
                    setLastDrawn(null);
                    localStorage.removeItem('bingo_drawn_numbers');
                    localStorage.removeItem('bingo_last_drawn');
                }
            };

            const filteredData = useMemo(() => {
                const s = search.toLowerCase().trim();
                // No Admin, se não houver pesquisa, mostra as últimas 50 vendidas
                if (view === 'admin' && !s) {
                    return salesData.filter(item => item.sold).slice(-50).reverse();
                }

                if (!s) return salesData.slice(0, 50); // Fallback para não travar a tela

                // RESTRIÇÃO 2: Busca exata se for apenas número
                const isNumeric = !isNaN(s) && s !== "";

                return salesData.filter(item => {
                    const matchId = isNumeric ?
                        item.id.toString() === s : // Busca EXATA para números
                        item.id.toString().includes(s); // Busca parcial para o resto (opcional)

                    const matchBuyer = (item.buyer || '').toLowerCase().includes(s);
                    const matchSeller = (item.seller || '').toLowerCase().includes(s);

                    return matchId || matchBuyer || matchSeller;
                }).slice(0, 200);
            }, [salesData, search, view]);

            return (
                <div className="container">
                    <header className="main-header">
                        <img src="src/assets/fortunasys.png" alt="Logo" />
                        <div className="title-group">
                            <h1 className="bebas">FORTUNASYS</h1>
                            <p className="space" style={{ fontSize: '0.8rem', color: 'var(--text-dim)', letterSpacing: '5px', textTransform: 'uppercase', fontWeight: 700 }}>
                                Gestão inteligente para bingos
                            </p>
                        </div>
                    </header>

                    <div className="header">
                        <div>
                            <h1 className="bebas" style={{ fontSize: '1.4rem', letterSpacing: '2px' }}>
                                {view === 'sales' ? 'CENTRAL DE VENDAS' : 'PAINEL DE AUDITORIA'}
                            </h1>
                        </div>
                        <div style={{ display: 'flex', gap: '10px' }}>
                            {view === 'sales' ? (
                                <button className="btn-action btn-outline" style={{ fontSize: '0.65rem', padding: '10px 20px' }}
                                    onClick={() => setShowLogin(true)}>ADMIN</button>
                            ) : (
                                <>
                                    <button className="btn-action btn-outline" style={{ fontSize: '0.65rem', padding: '10px 20px' }} onClick={fetchData}>ATUALIZAR</button>
                                    <button className="btn-action btn-outline" style={{ fontSize: '0.65rem', padding: '10px 20px' }} onClick={() => setView('sales')}>SAIR</button>
                                </>
                            )}
                        </div>
                    </div>

                    <AnimatePresence>
                        {showToast && <motion.div initial={{ y: 50, opacity: 0, x: '-50%' }} animate={{ y: 0, opacity: 1, x: '-50%' }} exit={{ y: 50, opacity: 0, x: '-50%' }} className="success-toast">VENDA CONFIRMADA</motion.div>}
                    </AnimatePresence>

                    {view === 'sales' ? (
                        <div style={{ flex: 1 }}>
                            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="glass sale-form">
                                <form onSubmit={submitSale}>
                                    <div className="form-group">
                                        <label className="form-label">Número da Cartela</label>
                                        <input type="number" required className="form-input"
                                            style={{ borderColor: cardStatusMsg ? 'var(--danger)' : '' }}
                                            placeholder="Ex: 100" value={formCard} onChange={e => setFormCard(e.target.value)} />

                                        <AnimatePresence>
                                            {cardStatusMsg && (
                                                <motion.p initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }}
                                                    style={{ color: 'var(--danger)', fontSize: '0.75rem', fontWeight: 800, marginTop: '10px', textTransform: 'uppercase' }}>
                                                    {cardStatusMsg}
                                                </motion.p>
                                            )}
                                        </AnimatePresence>
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Nome do Comprador</label>
                                        <input type="text" required className="form-input" placeholder="Quem comprou?" value={formBuyer} onChange={e => setFormBuyer(e.target.value)} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">WhatsApp</label>
                                        <input type="text" required className="form-input" placeholder="(00) 00000-0000"
                                            value={formPhone} onChange={handlePhoneChange} maxLength={15} />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">Seu Nome (Vendedor)</label>
                                        <input type="text" required className="form-input" placeholder="Quem está vendendo?" value={formSeller} onChange={e => setFormSeller(e.target.value)} />
                                    </div>
                                    <button type="submit" disabled={isLoading} className="btn-action btn-primary" style={{ width: '100%', height: '65px', marginTop: '10px', fontSize: '1.2rem' }}>
                                        {isLoading ? 'CARREGANDO...' : 'CONFIRMAR VENDA'}
                                    </button>
                                </form>
                            </motion.div>
                        </div>
                    ) : (
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                            <div className="admin-nav">
                                <div className={`nav-link ${adminTab === 'vendas' ? 'active' : ''}`} onClick={() => setAdminTab('vendas')}>AUDITORIA DE VENDAS</div>
                                <div className={`nav-link ${adminTab === 'bingo' ? 'active' : ''}`} onClick={() => setAdminTab('bingo')}>CENTRAL DE COMANDO</div>
                            </div>

                            {adminTab === 'vendas' ? (
                                <>
                                    <div className="stats-grid">
                                        <div className="stat-box"><p className="stat-label">EMISSÕES TOTAIS</p><p className="stat-value">{stats.total}</p></div>
                                        <div className="stat-box" style={{ borderColor: 'var(--success)' }}><p className="stat-label">CARTELAS VENDIDAS</p><p className="stat-value" style={{ color: 'var(--success)' }}>{stats.sold}</p></div>
                                        <div className="stat-box" style={{ borderColor: 'var(--secondary)' }}><p className="stat-label">TAXA DE OCUPAÇÃO</p><p className="stat-value" style={{ color: 'var(--secondary)' }}>{stats.percent}%</p></div>
                                        <button className="btn-action btn-primary" onClick={startRaffle}>SORTEIO DE BRINDES</button>
                                    </div>

                                    <div className="glass" style={{ padding: '20px', marginBottom: '25px', borderRadius: '24px' }}>
                                        <input type="text" className="form-input" placeholder="PESQUISAR POR REGISTRO OU TITULAR..." value={search} onChange={e => setSearch(e.target.value)} />
                                    </div>

                                    <div className="glass sales-table">
                                        <div className="table-header">
                                            <div>CARTELA</div><div>COMPRADOR</div><div className="text-dim">WHATSAPP</div><div className="text-dim">VENDEDOR</div><div>STATUS</div>
                                        </div>
                                        <div className="table-body custom-scroll">
                                            {filteredData.map(item => (
                                                <div key={item.id} className="sale-row">
                                                    <div style={{ fontFamily: 'Bebas Neue', fontSize: '1.4rem', color: 'var(--primary)' }}>{item.id}</div>
                                                    <div style={{ fontWeight: 700 }}>{item.buyer || '-'}</div>
                                                    <div className="text-dim" style={{ fontSize: '0.8rem' }}>{item.phone || '-'}</div>
                                                    <div className="text-dim" style={{ fontSize: '0.8rem' }}>{item.seller || '-'}</div>
                                                    <div className={`status-badge ${item.sold ? 'status-sold' : 'status-open'}`}>{item.sold ? 'OK' : 'ABERTA'}</div>
                                                </div>
                                            ))}
                                            {filteredData.length === 0 && <div style={{ padding: '40px', textAlign: 'center', color: 'var(--text-dim)' }}>Nenhuma venda encontrada.</div>}
                                        </div>
                                    </div>
                                </>
                            ) : (
                                <div className="bingo-grid">
                                    <div className="bingo-main-area">
                                        {/* TOP STATS */}
                                        <div className="bingo-header-stats">
                                            <div className="h-stat">
                                                <span className="h-stat-label">Cartelas em Circulação</span>
                                                <span className="h-stat-val">{stats.sold}</span>
                                            </div>
                                            <div className="h-stat">
                                                <span className="h-stat-label">Números Chamados</span>
                                                <span className="h-stat-val">{drawnNumbers.length}</span>
                                            </div>
                                            <div className="h-stat" style={{ borderColor: bingoCards.length > 0 ? 'var(--success)' : 'var(--danger)' }}>
                                                <span className="h-stat-label">Banco de Dados</span>
                                                <span className="h-stat-val" style={{ fontSize: '1rem', color: bingoCards.length > 0 ? 'var(--success)' : 'var(--danger)' }}>
                                                    {bingoCards.length > 0 ? `SISTEMA OPERACIONAL` : 'FALHA DE DADOS'}
                                                </span>
                                            </div>
                                        </div>

                                        {/* MAIN BOARD */}
                                        <div className="glass number-board">
                                            {Array.from({ length: 75 }, (_, i) => i + 1).map(n => (
                                                <button key={n} onClick={() => toggleNumber(n)} className={`num-btn ${drawnNumbers.includes(n) ? 'active' : ''}`}>{n}</button>
                                            ))}
                                        </div>

                                        {/* BOTTOM STATS */}
                                        <div className="bingo-footer-stats">
                                            {[
                                                { label: 'Faltam 10', val: bingoStats.f10 },
                                                { label: 'Faltam 7', val: bingoStats.f7 },
                                                { label: 'Faltam 5', val: bingoStats.f5 },
                                                { label: 'Faltam 4', val: bingoStats.f4 },
                                                { label: 'Faltam 3', val: bingoStats.f3 },
                                                { label: 'Faltam 2', val: bingoStats.f2 },
                                                { label: 'Faltam 1', val: bingoStats.f1 }
                                            ].map((s, idx) => (
                                                <div key={idx} className={`f-stat ${s.val > 0 && idx >= 4 ? 'active-glow' : ''}`}>
                                                    <span className="f-stat-label">{s.label}</span>
                                                    <span className="f-stat-val">{s.val}</span>
                                                </div>
                                            ))}
                                            <button className="btn-action btn-outline" style={{ marginTop: '5px', padding: '5px', fontSize: '0.6rem' }} onClick={resetBingo}>RESET GERAL</button>
                                        </div>
                                    </div>

                                    <div className="flex flex-col gap-4">
                                        <div className="glass big-call">
                                            <span className="h-stat-label">Última Chamada</span>
                                            <div className="big-num-call bebas">{lastDrawn || '--'}</div>
                                        </div>

                                        <div className="glass winners-box" style={{ flex: 1 }}>
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                <h4 className="bebas" style={{ color: 'var(--success)', letterSpacing: '2px' }}>GANHADORES IDENTIFICADOS</h4>
                                                {bingoStats.winners.length > 0 && <span className="status-badge status-sold">{bingoStats.winners.length}</span>}
                                            </div>
                                            <div className="custom-scroll" style={{ overflowY: 'auto', flex: 1 }}>
                                                {bingoStats.winners.map(w => (
                                                    <div key={w.id} className="winner-mini" onClick={() => setVerifyingBingo(w)} style={{ cursor: 'pointer' }}>
                                                        <div>
                                                            <h5>CARTELA #{w.id}</h5>
                                                            <p>{w.buyer}</p>
                                                        </div>
                                                        <span className="status-badge status-sold">VERIFICAR</span>
                                                    </div>
                                                ))}
                                                {bingoStats.winners.length === 0 && <p className="text-dim" style={{ textAlign: 'center', fontSize: '0.6rem', marginTop: '20px', letterSpacing: '1px' }}>SISTEMA AGUARDANDO...</p>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    <AnimatePresence>
                        {verifyingBingo && (
                            <div className="modal-bg">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className="glass modal-content" style={{ maxWidth: '600px', padding: '40px' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '20px', marginBottom: '30px', borderBottom: '1px solid var(--glass-border)', paddingBottom: '20px' }}>
                                        <img src="src/assets/fortunasys.png" alt="Logo"
                                            style={{ width: '60px', height: 'auto' }} />
                                        <div style={{ textAlign: 'left' }}>
                                            <h2 className="bebas" style={{ fontSize: '3rem', color: 'var(--primary)', lineHeight: 1 }}>CARTELA #{verifyingBingo.id}</h2>
                                            <p className="space" style={{ fontSize: '0.7rem', color: 'var(--text-dim)', letterSpacing: '2px' }}>
                                                {verifyingBingo.buyer.toUpperCase()} | VENDEDOR: {verifyingBingo.seller.toUpperCase()}
                                            </p>
                                        </div>
                                    </div>

                                    <div className="bingo-card-digital">
                                        <div className="bingo-card-header">
                                            <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
                                        </div>
                                        <div className="bingo-card-grid">
                                            {Array.from({ length: 5 }).map((_, row) => (
                                                <React.Fragment key={row}>
                                                    {[0, 1, 2, 3, 4].map(col => {
                                                        const num = verifyingBingo.numbers[col * 5 + row];
                                                        const isDrawn = drawnNumbers.includes(num);
                                                        return (
                                                            <div key={col} className={`card-num ${isDrawn ? 'is-drawn' : ''}`}>
                                                                {num}
                                                            </div>
                                                        );
                                                    })}
                                                </React.Fragment>
                                            ))}
                                        </div>
                                    </div>

                                    <div style={{ marginTop: '30px', display: 'flex', justifyContent: 'center' }}>
                                        <button onClick={() => setVerifyingBingo(null)} className="btn-action btn-outline" style={{ padding: '12px 40px' }}>FECHAR CONFERÊNCIA</button>
                                    </div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {isRaffleModal && (
                            <div className="modal-bg" style={{ zIndex: 3000 }}>
                                <motion.div initial={{ scale: 0.8, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.8, opacity: 0 }} 
                                    className="glass modal-content" style={{ maxWidth: '500px', textAlign: 'center', padding: '50px' }}>
                                    
                                    <div style={{ marginBottom: '40px' }}>
                                        <h2 className="bebas" style={{ fontSize: '2.8rem', color: isRaffling ? 'var(--text-dim)' : 'var(--primary)', letterSpacing: '4px' }}>
                                            {isRaffling ? 'SORTEANDO...' : 'TEMOS UM GANHADOR!'}
                                        </h2>
                                    </div>

                                    {raffleResult && (
                                        <motion.div layout initial={{ opacity: 0 }} animate={{ opacity: 1 }} style={{ padding: '20px 0' }}>
                                            <div style={{ fontSize: '10rem', color: 'var(--primary)', fontFamily: 'Bebas Neue', lineHeight: 0.8, textShadow: isRaffling ? 'none' : '0 0 50px var(--primary-glow)', marginBottom: '30px' }}>
                                                {raffleResult.id}
                                            </div>
                                            
                                            {!isRaffling && (
                                                <motion.div initial={{ y: 20, opacity: 0 }} animate={{ y: 0, opacity: 1 }} style={{ marginTop: '30px', borderTop: '1px solid var(--glass-border)', paddingTop: '30px' }}>
                                                    <h3 className="bebas" style={{ fontSize: '3rem', color: '#FFF', letterSpacing: '2px' }}>{raffleResult.buyer.toUpperCase()}</h3>
                                                    <p className="space" style={{ color: 'var(--text-dim)', fontSize: '0.9rem', letterSpacing: '3px', marginTop: '10px', fontWeight: 600 }}>
                                                        VENDEDOR: {raffleResult.seller.toUpperCase()}
                                                    </p>
                                                </motion.div>
                                            )}
                                        </motion.div>
                                    )}

                                    <div style={{ marginTop: '50px', display: 'flex', justifyContent: 'center', width: '100%' }}>
                                        {!isRaffling && (
                                            <button onClick={() => setIsRaffleModal(false)} className="btn-action btn-primary" 
                                                style={{ padding: '20px 60px', fontSize: '1.1rem', borderRadius: '18px', width: 'auto', minWidth: '200px' }}>
                                                CONCLUIR SORTEIO
                                            </button>
                                        )}
                                    </div>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <AnimatePresence>
                        {showLogin && (
                            <div className="modal-bg">
                                <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} 
                                    className="glass modal-content" style={{ maxWidth: '400px', padding: '40px' }}>
                                    <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                                        <img src="src/assets/fortunasys.png" alt="Logo" style={{ width: '60px', height: 'auto', marginBottom: '10px' }} />
                                        <h2 className="bebas" style={{ fontSize: '2.5rem', color: 'var(--primary)' }}>ACESSO RESTRITO</h2>
                                        <p className="space" style={{ fontSize: '0.6rem', color: 'var(--text-dim)', letterSpacing: '2px' }}>INSIRA SUAS CREDENCIAIS</p>
                                    </div>

                                    <form onSubmit={handleLogin}>
                                        <div className="form-group">
                                            <label className="form-label">Usuário</label>
                                            <input type="text" required className="form-input" 
                                                value={loginUser} onChange={e => setLoginUser(e.target.value)} />
                                        </div>
                                        <div className="form-group">
                                            <label className="form-label">Senha</label>
                                            <input type="password" required className="form-input" 
                                                value={loginPass} onChange={e => setLoginPass(e.target.value)} />
                                        </div>

                                        <AnimatePresence>
                                            {loginError && (
                                                <motion.p initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                                    style={{ color: 'var(--danger)', fontSize: '0.75rem', textAlign: 'center', marginBottom: '15px', fontWeight: 800 }}>
                                                    CREDENCIAIS INVÁLIDAS
                                                </motion.p>
                                            )}
                                        </AnimatePresence>

                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                            <button type="submit" className="btn-action btn-primary" style={{ width: '100%', height: '50px' }}>ENTRAR</button>
                                            <button type="button" onClick={() => setShowLogin(false)} className="btn-action btn-outline" style={{ width: '100%', height: '50px' }}>CANCELAR</button>
                                        </div>
                                    </form>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    <footer style={{ marginTop: 'auto', paddingTop: '40px', paddingBottom: '20px', textAlign: 'center', opacity: 0.5 }}>
