<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Festa Junina PRO 🎯</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f77f00;
            --secondary: #e63946;
            --success: #06d6a0;
            --warning: #ffd60a;
            --info: #118ab2;
            --bg-dark: #0f0f1a;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(247, 127, 0, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(114, 9, 183, 0.1) 0%, transparent 40%);
            color: #f8f9fa;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .luckiest { font-family: 'Luckiest Guy', cursive; letter-spacing: 2px; }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .bandeirinhas {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            display: flex; justify-content: space-around; z-index: 100; pointer-events: none;
        }

        .bandeirinha {
            width: 30px; height: 45px;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%);
            animation: wave 3s ease-in-out infinite;
        }

        @keyframes wave { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }

        .container { max-width: 1400px; margin: 0 auto; padding: 60px 20px 40px; position: relative; z-index: 10; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-size: 4.5rem;
            background: linear-gradient(to right, #f77f00, #ffd60a, #e63946);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(247, 127, 0, 0.3));
        }

        .main-grid { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 30px; }

        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }

        .btn {
            padding: 16px 32px; border: none; border-radius: 16px;
            font-weight: 800; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary { background: linear-gradient(135deg, var(--success), #05b384); color: white; }
        .btn-ghost { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); }

        .number-cell {
            aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.9rem; transition: all 0.3s;
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.3);
        }

        .number-cell.drawn {
            background: var(--primary); color: white; transform: scale(1.1);
            box-shadow: 0 0 15px rgba(247, 127, 0, 0.4);
        }

        .globo {
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #f77f00, #e63946);
            display: flex; align-items: center; justify-content: center;
            font-size: 6rem; font-weight: 900; margin: 0 auto 30px;
            box-shadow: 0 0 60px rgba(230, 57, 70, 0.4), inset 0 -10px 20px rgba(0,0,0,0.3);
            border: 6px solid rgba(255,255,255,0.2);
        }

        .stats-box { text-align: center; padding: 20px; }
        .stats-val { font-size: 2.5rem; font-weight: 900; color: var(--primary); display: block; }
        .stats-label { font-size: 0.7rem; text-transform: uppercase; color: rgba(255,255,255,0.4); }

        .config-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
            z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        input[type="text"] {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; border-radius: 12px; color: white; margin-bottom: 20px;
        }

        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2); padding: 40px; border-radius: 20px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .upload-area:hover { border-color: var(--primary); background: rgba(247, 127, 0, 0.05); }

        .winner-card {
            background: linear-gradient(90deg, rgba(6, 214, 160, 0.1), transparent);
            border-left: 4px solid var(--success); padding: 15px; margin-bottom: 10px; border-radius: 0 12px 12px 0;
        }
    </style>
</head>
<body>
    <div class="bandeirinhas">
        <script>
            const colors = ['#f77f00', '#e63946', '#06d6a0', '#ffd60a', '#118ab2'];
            for(let i=0; i<25; i++) {
                document.write(`<div class="bandeirinha" style="background:${colors[i%5]}; animation-delay:${i*0.1}s"></div>`);
            }
        </script>
    </div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        const BINGO_NUMBERS = Array.from({ length: 75 }, (_, i) => i + 1);

        function App() {
            const [cards, setCards] = useState([]);
            const [soldCount, setSoldCards] = useState(100);
            const [drawn, setDrawn] = useState([]);
            const [isConfig, setIsConfig] = useState(true);
            const [eventName, setEventName] = useState('BINGO DA IGREJA');
            const [isVoice, setIsVoice] = useState(true);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, { type: 'binary' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const data = XLSX.utils.sheet_to_json(ws);
                    const parsed = data.map(row => {
                        const numbers = [];
                        for(let i=1; i<=25; i++) if(row[`B${i}`]) numbers.push(row[`B${i}`]);
                        return { NUM: row.NUM, numbers };
                    });
                    setCards(parsed);
                    setSoldCards(parsed.length);
                };
                reader.readAsBinaryString(file);
            };

            const draw = useCallback(() => {
                if (drawn.length >= 75) return;
                const remaining = BINGO_NUMBERS.filter(n => !drawn.includes(n));
                const next = remaining[Math.floor(Math.random() * remaining.length)];
                setDrawn(prev => [...prev, next]);
                
                if (isVoice) {
                    const msg = new SpeechSynthesisUtterance(next.toString());
                    msg.lang = 'pt-BR';
                    window.speechSynthesis.speak(msg);
                }
            }, [drawn, isVoice]);

            const stats = useMemo(() => {
                const active = cards.slice(0, soldCount);
                const dSet = new Set(drawn);
                const res = { w1: [], w2: [], winners: [] };
                active.forEach(c => {
                    const missing = c.numbers.filter(n => !dSet.has(n)).length;
                    if (missing === 0) res.winners.push(c.NUM);
                    else if (missing === 1) res.w1.push(c.NUM);
                    else if (missing === 2) res.w2.push(c.NUM);
                });
                return res;
            }, [cards, soldCount, drawn]);

            useEffect(() => {
                if (stats.winners.length > 0 && drawn.length > 0) {
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                }
            }, [stats.winners.length]);

            const last = drawn[drawn.length - 1];

            return (
                <div className="container">
                    <header className="header">
                        <motion.h1 initial={{y:-20}} animate={{y:0}} className="luckiest">{eventName}</motion.h1>
                        <p style={{color:'var(--primary)', fontWeight:700, letterSpacing:2}}>FESTA JUNINA 2024</p>
                    </header>

                    <main className="main-grid">
                        {/* Painel Esquerdo */}
                        <div className="glass p-8" style={{padding: '30px', textAlign: 'center'}}>
                            <h2 className="stats-label" style={{marginBottom: '20px'}}>Último Número</h2>
                            <div className="globo luckiest">
                                <AnimatePresence mode="wait">
                                    <motion.span key={last} initial={{scale:0}} animate={{scale:1}} exit={{scale:1.5, opacity:0}}>
                                        {last || '--'}
                                    </motion.span>
                                </AnimatePresence>
                            </div>
                            <button onClick={draw} disabled={cards.length === 0} className="btn btn-primary" style={{width:'100%', fontSize:'1.2rem'}}>
                                SORTEAR PEDRA
                            </button>
                            <div style={{marginTop: '20px', display: 'flex', gap: '10px'}}>
                                <button onClick={() => setIsVoice(!isVoice)} className="btn btn-ghost" style={{flex:1}}>
                                    {isVoice ? '🔊 Voz ON' : '🔇 Mudo'}
                                </button>
                                <button onClick={() => setIsConfig(true)} className="btn btn-ghost" style={{flex:1}}>⚙️ Config</button>
                            </div>
                        </div>

                        {/* Centro */}
                        <div className="glass" style={{padding: '30px'}}>
                            <div style={{display:'grid', gridTemplateColumns:'repeat(10, 1fr)', gap:'8px'}}>
                                {BINGO_NUMBERS.map(n => (
                                    <div key={n} className={`number-cell ${drawn.includes(n) ? 'drawn' : ''}`}>
                                        {n}
                                    </div>
                                ))}
                            </div>
                            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'20px', marginTop:'30px'}}>
                                <div className="glass stats-box">
                                    <span className="stats-val">{stats.w1.length}</span>
                                    <span className="stats-label">Falta 1</span>
                                </div>
                                <div className="glass stats-box">
                                    <span className="stats-val">{stats.w2.length}</span>
                                    <span className="stats-label">Faltam 2</span>
                                </div>
                            </div>
                        </div>

                        {/* Direita */}
                        <div className="glass" style={{padding: '30px', display:'flex', flexDirection:'column'}}>
                            <h2 className="luckiest" style={{color:'var(--success)', marginBottom:'20px'}}>🏆 Vencedores</h2>
                            <div style={{flex:1, overflowY:'auto'}}>
                                {stats.winners.length > 0 ? stats.winners.map(num => (
                                    <div key={num} className="winner-card">
                                        <b style={{color:'var(--success)'}}>CARTELA #{num}</b>
                                        <p style={{fontSize:'0.7rem', opacity:0.6}}>BINGO CONFIRMADO!</p>
                                    </div>
                                )) : <p style={{opacity:0.3, textAlign:'center', marginTop:'40px'}}>Aguardando vencedor...</p>}
                            </div>
                            <button onClick={() => confirm('Reiniciar?') && setDrawn([])} className="btn btn-ghost" style={{marginTop:'20px', color:'var(--secondary)'}}>
                                Reiniciar Bingo
                            </button>
                        </div>
                    </main>

                    {isConfig && (
                        <div className="config-overlay">
                            <motion.div initial={{scale:0.9}} animate={{scale:1}} className="glass" style={{maxWidth:'500px', width:'100%', padding:'40px'}}>
                                <h2 className="luckiest" style={{fontSize:'2rem', marginBottom:'30px', color:'var(--primary)'}}>CONFIGURAÇÃO</h2>
                                
                                <label className="stats-label">Nome do Evento</label>
                                <input type="text" value={eventName} onChange={e=>setEventName(e.target.value.toUpperCase())} />

                                <label className="stats-label">Base de Dados (Excel)</label>
                                <div className="upload-area" onClick={() => document.getElementById('f').click()}>
                                    <input type="file" id="f" hidden accept=".xls,.xlsx" onChange={handleFile} />
                                    <p style={{fontWeight:700}}>{cards.length > 0 ? `✅ ${cards.length} Cartelas Carregadas` : 'Clique para selecionar o bingo.xls'}</p>
                                </div>

                                {cards.length > 0 && (
                                    <div style={{marginTop:'20px'}}>
                                        <div style={{display:'flex', justifyContent:'space-between'}}>
                                            <label className="stats-label">Cartelas Vendidas</label>
                                            <b style={{color:'var(--primary)'}}>{soldCount}</b>
                                        </div>
                                        <input type="range" min="1" max={cards.length} value={soldCount} onChange={e=>setSoldCards(parseInt(e.target.value))} style={{width:'100%', accentColor:'var(--primary)'}} />
                                    </div>
                                )}

                                <button onClick={()=>setIsConfig(false)} disabled={cards.length === 0} className="btn btn-primary" style={{width:'100%', marginTop:'30px'}}>
                                    SALVAR E INICIAR
                                </button>
                            </motion.div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
